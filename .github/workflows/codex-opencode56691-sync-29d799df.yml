name: OpenCode 56691 synced candidate 29d799df
on:
  push:
    branches: ['codex-ci/opencode56691-sync-29d799df']
permissions:
  contents: read
jobs:
  reproduce:
    if: github.repository == 'GoldArowana/opencode' && github.ref == 'refs/heads/codex-ci/opencode56691-sync-29d799df'
    name: Shell undo (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: synced-candidate
            sha: 49cd8586359782730291bf1fdaace05dde2b9725
            tree: c03a13ffa6419c4601d6b72476af059e89adeb1b
            parents: '829405fac24e13985326f4fbced0e87ed7b5dd65 966168800cb80f336cb4267f0484f193a15f1292'
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: GoldArowana/opencode
          ref: '${{ matrix.sha }}'
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact source identity and clean tracked bytes
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = '${{ matrix.sha }}'
          test "$(git rev-parse HEAD^{tree})" = '${{ matrix.tree }}'
          parents="$(git cat-file -p HEAD | awk '$1 == "parent" {print $2}' | paste -sd ' ' -)"
          test "$parents" = '${{ matrix.parents }}'
          printf 'VALIDATION_SOURCE %s tree=%s parents=%s\n' '${{ matrix.sha }}' '${{ matrix.tree }}' "$parents"
          git diff HEAD --exit-code
          git config --local user.name 'OpenCode CI'
          git config --local user.email 'opencode-ci@example.invalid'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64-baseline.zip
      - name: Bootstrap frozen dependencies
        id: bootstrap
        working-directory: source
        timeout-minutes: 12
        run: |
          test "$(bun --version)" = '1.4.4'
          test "$(node -p "require('./package.json').packageManager")" = 'bun@1.4.4'
          node --version
          bun --version
          if ! python3 -c 'import setuptools'; then
            python3 -m venv "$RUNNER_TEMP/opencode-python"
            export PATH="$RUNNER_TEMP/opencode-python/bin:$PATH"
            python3 -m pip install --no-cache-dir setuptools
          fi
          echo FS_BEFORE_BOOTSTRAP
          df -B1 --output=avail .
          bun install --frozen-lockfile --no-cache
          echo FS_AFTER_BOOTSTRAP
          df -B1 --output=avail .
          du -s -B1 node_modules
          for cache in "$HOME/.bun/install/cache" "$HOME/.cache/electron"; do
            if [ -d "$cache" ]; then du -s -B1 "$cache"; fi
          done
          git diff HEAD --exit-code
      - name: Run exact concurrent shell regression
        working-directory: source
        timeout-minutes: 5
        run: >-
          bun run --cwd packages/core test test/session-shell.test.ts
          --test-name-pattern 'keeps both shell outputs when undo settlement overlaps another shell startup'
      - name: Run adjacent session and undo regressions
        working-directory: source
        timeout-minutes: 9
        run: >-
          bun run --cwd packages/core test
          test/session-shell.test.ts test/session-revert.test.ts
          test/session-prompt.test.ts test/session-compact.test.ts test/session-compaction.test.ts
          test/session-execution.test.ts test/session-run-coordinator.test.ts test/tool-shell.test.ts
      - name: Run official compiler for core
        if: always() && steps.bootstrap.outcome == 'success'
        working-directory: source
        timeout-minutes: 5
        run: bun run --cwd packages/core typecheck:tsc
      - name: Run canonical pre-push checks
        if: always() && steps.bootstrap.outcome == 'success'
        working-directory: source
        timeout-minutes: 10
        run: sh .husky/pre-push
      - name: Check tracked source at exit
        if: always()
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = '${{ matrix.sha }}'
          test "$(git rev-parse HEAD^{tree})" = '${{ matrix.tree }}'
          git diff HEAD --exit-code
          echo FS_AFTER_VALIDATION
          df -B1 --output=avail .
